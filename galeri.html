    <!-- LIGHTBOX OVERLAY -->
    <div class="lightbox-overlay" id="lightbox">
        <div class="lightbox-counter" id="lightboxCounter">1 / 18</div>
        <button class="side-nav-btn prev" id="prevBtn" aria-label="Previous image">&#10094;</button>
        <button class="side-nav-btn next" id="nextBtn" aria-label="Next image">&#10095;</button>
        <div class="lightbox-img-container">
            <img src="" alt="Full View" class="lightbox-img" id="lightboxImg">
        </div>
    </div>

    <script>
        // ---- Lightbox ----
        const galleryItems = document.querySelectorAll('.gallery-item');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCounter = document.getElementById('lightboxCounter');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentIndex = 0;
        const images = Array.from(galleryItems).map(item => item.querySelector('img').src);

        galleryItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                currentIndex = index;
                openLightbox();
            });
        });

        function openLightbox() {
            updateLightbox();
            lightbox.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % images.length;
            updateLightbox();
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateLightbox();
        }

        function updateLightbox() {
            lightboxImg.src = images[currentIndex];
            lightboxCounter.textContent = `${currentIndex + 1} / ${images.length}`;
        }

        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });
        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
        lightbox.addEventListener('click', () => closeLightbox());

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight' && lightbox.style.display === 'flex') showNext();
            if (e.key === 'ArrowLeft' && lightbox.style.display === 'flex') showPrev();
        });


        // ---- Mobile Navigation ----
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navMenu.classList.toggle('active');
            document.body.classList.toggle('no-scroll');
        });

        const navLinks = document.querySelectorAll('.nav-menu a');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                navMenu.classList.remove('active');
                document.body.classList.remove('no-scroll');
            });
        });

        // ---- Pagination Logic ----
        let currentPage = 1;
        const totalPages = 2;
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const pageIndicator = document.getElementById('pageIndicator');
        const galleryGrid1 = document.getElementById('galleryGrid1');
        const galleryGrid2 = document.getElementById('galleryGrid2');

        function updatePagination() {
            pageIndicator.innerHTML = `<strong>${currentPage}</strong> / ${totalPages}`;
            
            if (currentPage === 1) {
                galleryGrid1.style.display = '';
                galleryGrid2.style.display = 'none';
            } else {
                galleryGrid1.style.display = 'none';
                galleryGrid2.style.display = '';
            }
            
            // Re-bind lightbox to new visible items
            bindLightbox();
        }

        prevPageBtn.addEventListener('click', (e) => {
            if (currentPage > 1) {
                currentPage--;
                updatePagination();
            }
        });

        nextPageBtn.addEventListener('click', (e) => {
            if (currentPage < totalPages) {
                currentPage++;
                updatePagination();
            }
        });

        // Function to bind lightbox to currently visible items
        let visibleImages = [];
        function bindLightbox() {
            const currentGrid = currentPage === 1 ? galleryGrid1 : galleryGrid2;
            const currentItems = currentGrid.querySelectorAll('.gallery-item');
            
            visibleImages = Array.from(currentItems).map(item => item.querySelector('img').src);
            
            // Remove old listeners by cloning
            currentItems.forEach((item, index) => {
                const newItem = item.cloneNode(true);
                item.parentNode.replaceChild(newItem, item);
                
                newItem.addEventListener('click', () => {
                    currentIndex = index;
                    openLightbox();
                });
            });
        }
        
        // Ensure Lightbox uses the visibleImages array
        function updateLightbox() {
            lightboxImg.src = visibleImages[currentIndex];
            lightboxCounter.textContent = `${currentIndex + 1} / ${visibleImages.length}`;
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % visibleImages.length;
            updateLightbox();
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + visibleImages.length) % visibleImages.length;
            updateLightbox();
        }
        
        // Initial bind
        bindLightbox();

    </script>
